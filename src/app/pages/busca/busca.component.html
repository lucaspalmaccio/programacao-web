<main class="container py-4 py-md-5">
  <p class="text-muted mb-4">
    Pesquisa por: <strong class="text-vinho">{{ termo || 'todos os produtos' }}</strong>
  </p>

  <div class="row g-4">
    @for (produto of resultados; track produto.id) {
      <div class="col-6 col-md-4 col-lg-3">
        <app-produto-card [produto]="produto"></app-produto-card>
      </div>
    } @empty {
      <p class="text-muted">Nenhum vinho encontrado para essa busca.</p>
    }
  </div>
</main>
