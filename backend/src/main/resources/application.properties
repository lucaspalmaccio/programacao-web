spring.application.name=divino-loja
server.port=8080

# H2 em arquivo (os dados sobrevivem ao reiniciar). Console em http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:file:./data/divino;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jackson.default-property-inclusion=non_null

# Uploads de fotos dos vinhos (limite de 2 MB por imagem)
divino.upload-dir=./uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Segurança: troque o segredo e a senha do admin fora do desenvolvimento
divino.seguranca.segredo=troque-este-segredo-de-desenvolvimento-32bytes-ou-mais
divino.seguranca.validade-horas=12
divino.admin.email=admin@divino.com
divino.admin.senha=Admin@123
