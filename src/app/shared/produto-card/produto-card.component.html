<div class="card h-100 card-produto">
  <div class="position-relative">
    <a [routerLink]="['/produto', produto.id]" [attr.aria-label]="'Ver detalhes de ' + produto.nome">
      <img [src]="produto.foto" class="card-img-top produto-foto" [alt]="produto.nome" loading="lazy" appFotoFallback>
    </a>
    <button
      type="button"
      class="btn-favorito"
      [class.ativo]="favoritos.ehFavorito(produto.id)"
      [attr.aria-pressed]="favoritos.ehFavorito(produto.id)"
      [attr.aria-label]="favoritos.ehFavorito(produto.id) ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
      (click)="favoritos.alternar(produto.id)"
    >
      <i class="bi" [class.bi-heart-fill]="favoritos.ehFavorito(produto.id)" [class.bi-heart]="!favoritos.ehFavorito(produto.id)"></i>
    </button>
  </div>

  <div class="card-body d-flex flex-column">
    <h3 class="h6 nome mb-2">{{ produto.nome }}</h3>
    <p class="meta mb-0">{{ produto.tipo }}, {{ produto.uva }}</p>
    <p class="meta mb-3">{{ produto.pais }}, {{ produto.regiao }}</p>

    <div class="mt-auto d-flex justify-content-between align-items-center gap-2">
      <strong class="text-vinho">R$ {{ produto.preco.toFixed(2) }}</strong>
      <button type="button" class="btn btn-sm btn-vinho" (click)="comprar()">Comprar</button>
    </div>
  </div>
</div>
